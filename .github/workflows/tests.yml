name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # --ignore, not just -m "not requires_production_models": pytest
        # has to *import* a test module to discover/deselect its tests,
        # and tests/test_api.py imports api/main.py at module level, which
        # imports torch/transformers/fastapi - none of which are
        # installed here (requirements-api.txt is deliberately kept out
        # of the base install, see that file's own comment). Marker-based
        # deselection alone would still fail at collection with a
        # ModuleNotFoundError; --ignore skips the import entirely.
        run: pytest -v --ignore=tests/test_api.py
