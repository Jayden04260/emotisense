name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # --ignore, not just -m "not requires_production_models": pytest
        # has to *import* a test module to discover/deselect its tests,
        # and tests/test_api.py imports api/main.py at module level, which
        # imports torch/transformers/fastapi - none of which are
        # installed here (requirements-api.txt is deliberately kept out
        # of the base install, see that file's own comment). Marker-based
        # deselection alone would still fail at collection with a
        # ModuleNotFoundError; --ignore skips the import entirely.
        run: pytest -v --ignore=tests/test_api.py

  docker-build:
    # Validates the Dockerfile still builds on every push/PR, independent
    # of deploy - catches a broken image (bad COPY path, missing dep in
    # requirements-deploy.txt, etc.) at CI time rather than at deploy time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t emotisense-api .

  deploy:
    # Only after both checks above pass, and only for real pushes to main
    # (not PRs, which could come from a fork and shouldn't be able to
    # trigger a production deploy) - this is the actual CD half of the
    # pipeline. Render's own GitHub integration can auto-deploy on push
    # already, but that happens outside CI and isn't gated on tests or a
    # successful image build; hitting the deploy hook here makes "tests
    # + image build pass" a real precondition for shipping, not just a
    # status check someone could ignore.
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
